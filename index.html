function ic(n, s=18, c='') {

}
function kurMark(size=32, fill='#0A0E0F', accent='#FFCC00') {
  // kapture sunburst — central sun + 8 ray-circles, top-right ray = brand yellow
  return `<svg width="${size}" height="${size}" viewBox="0 0 64 64" fill="none" style="display:block">
    <circle cx="32" cy="32" r="14" fill="${fill}"/>
    <circle cx="32" cy="6"  r="4" fill="${fill}"/>
    <circle cx="50.4" cy="13.6" r="4" fill="${accent}"/>
    <circle cx="58" cy="32" r="4" fill="${fill}"/>
    <circle cx="50.4" cy="50.4" r="4" fill="${fill}"/>
    <circle cx="32" cy="58" r="4" fill="${fill}"/>
    <circle cx="13.6" cy="50.4" r="4" fill="${fill}"/>
    <circle cx="6" cy="32" r="4" fill="${fill}"/>
    <circle cx="13.6" cy="13.6" r="4" fill="${fill}"/>
  </svg>`;
}
function avatar(name, size=32) {
  return `<div class="avatar" style="width:${size}px;height:${size}px;font-size:${Math.round(size*0.4)}px">${esc(initials(name))}</div>`;
}
function scoreBadge(score, size=64) {
  const tone = score >= 80 ? '#0E7C4A' : score >= 60 ? '#0A0E0F' : score >= 40 ? '#C76F12' : '#B5301A';
  const r = (size-10)/2;
  const c = 2*Math.PI*r;
  const off = c - (score/100)*c;
  return `<div style="position:relative;width:${size}px;height:${size}px">
    <svg width="${size}" height="${size}">
      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="#EFEDE7" stroke-width="5"/>
      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${tone}" stroke-width="5"
        stroke-dasharray="${c}" stroke-dashoffset="${off}" stroke-linecap="round"
        transform="rotate(-90 ${size/2} ${size/2})"/>
    </svg>
    <div style="position:absolute;inset:0;display:grid;place-items:center;font-weight:700;font-size:${size*0.32}px">${score}</div>
  </div>`;
}
function pillarBar(p) {
  const tone = p.score >= 80 ? 'green' : p.score >= 60 ? '' : p.score >= 40 ? 'amber' : 'red';
  return `<div>
    <div class="flex items-center justify-between mb-1">
      <span class="text-xs font-semibold">${esc(p.label)}</span>
      <span class="text-xs font-bold">${p.score}</span>
    </div>
    <div class="progress ${tone}"><span style="width:${p.score}%"></span></div>
  </div>`;
}
function brandLogo(size='md', variant='nav') {
  const sz = size==='lg'?40:size==='sm'?22:28;

/* ============================ ROUTER & ACTIONS ============================ */
function navigate(route) {
  setState({ route, sidebarOpen:false });
  window.scrollTo({ top:0, behavior:'instant' });
}
function login(email, password) {
  if (!email) return 'Enter your email.';
  if (!password) return 'Enter your password.';
  const u = USERS.find(x => x.email.toLowerCase() === email.toLowerCase());
  if (!u) return 'No portal found for that email. Contact kapture for access.';
  if (password !== 'demo1234') return 'Incorrect password.';
  setState({ user:u, view:'app', modal:null });
  return null;
}
function logout() {
  setState({ user:null, view:'landing', route:'dashboard', profileOpen:false });
}
function toggleStatus(id) {
  const a = State.actions.find(x => x.id === id);
  if (!a) return;
  const next = a.status === 'done' ? 'todo' : a.status === 'todo' ? 'in_progress' : 'done';
  setState({ actions: State.actions.map(x => x.id===id?{...x,status:next}:x) });
  showToast(`Marked "${a.title.slice(0,30)}…" as ${next.replace('_',' ')}`);
}
function sendMessage(text) {
  if (!text.trim() || !State.user) return;
  const other = State.user.role === 'client' ? 'U-MGR' : 'U-CLIENT';
  setState({ messages: [...State.messages, { id:uid('M'), from:State.user.id, to:other, text:text.trim(), at:new Date().toISOString(), read:false }], draft:'' });
}
function doSync() {
  setState({ syncing:true });
  setTimeout(() => { setState({ syncing:false, lastSync:Date.now() }); showToast('Synced.'); }, 900);
}

/* ============================ RENDER ============================ */
function render() {
  const root = document.getElementById('app');
  if (State.user) root.innerHTML = renderShell();
  else if (State.view === 'login') root.innerHTML = renderLogin();
  else root.innerHTML = renderLanding();
  document.getElementById('modal-root').innerHTML = renderModal();
  document.getElementById('toast-root').innerHTML = State.toast ? `<div class="toast">${ic('check',16)} ${esc(State.toast)}</div>` : '';
  bind();
  drawCharts();
}

/* ============================ EVENTS ============================ */
/* === LANDING ANIMATIONS === */
const LANDING_WORDS = ['brand','app','podcast','product','school','mall','farm','bank','content','event','network','bakery','club','startup','channel','concert','village','idea','winery','music','film','career','agency','company','factory','studio','store','blog','label','team'];
const LANDING_PROMPTS = [
  'I want to start a podcast',
  'I have an idea for a mobile app',
  "I'm launching a bakery",
  'I want to build a personal brand',
  "I'm starting a nonprofit",
  'I want to open a winery',
  'I have a film concept',
  "I'm building a tech startup",
  'I want to launch a YouTube channel',
  "I'm setting up an online store",
  'I run a school and need a brand system',
  'I have an idea but no name yet',
];
let _landingIntervals = [];
let _landingTimeouts = [];
function clearLandingAnims() {
  _landingIntervals.forEach(clearInterval); _landingIntervals = [];
  _landingTimeouts.forEach(clearTimeout); _landingTimeouts = [];
}
function startLandingAnims() {
  clearLandingAnims();

  // Headline typewriter — type, hold, erase, next. No cursor.
  const wEl = document.getElementById('kur-word');
  if (wEl) {
    let wi = 0, ci = 0, mode = 'type';
    wEl.textContent = '';
    const step = () => {
      const target = LANDING_WORDS[wi];
      let delay = 70;
      if (mode === 'type') {
        if (ci < target.length) { ci++; wEl.textContent = target.slice(0, ci); delay = 70; }
        else { mode = 'hold'; delay = 1500; }
      } else if (mode === 'hold') {
        mode = 'erase'; delay = 35;
      } else if (mode === 'erase') {
        if (ci > 0) { ci--; wEl.textContent = target.slice(0, ci); delay = 35; }
        else { mode = 'gap'; delay = 220; }
      } else { // gap
        mode = 'type'; wi = (wi + 1) % LANDING_WORDS.length; delay = 0;
      }
      _landingTimeouts.push(setTimeout(step, delay));
    };
    step();
  }
  const inp = document.getElementById('kur-prompt-input');
  if (inp) {
    let pi = 0;
    let ci = 0;
    let mode = 'type'; // 'type' | 'hold' | 'erase'
    let buf = '';
    let userTyping = false;
    inp.addEventListener('focus', () => { userTyping = true; });
    inp.addEventListener('input', () => { userTyping = !!inp.value; if (!inp.value) userTyping = false; });
    _landingIntervals.push(setInterval(() => {
      if (userTyping || document.activeElement === inp) return;
      const target = LANDING_PROMPTS[pi];
      if (mode === 'type') {
        if (ci < target.length) { buf = target.slice(0, ++ci); inp.placeholder = buf; }
        else { mode = 'hold'; ci = 0; }
      } else if (mode === 'hold') {
        if (++ci > 14) { mode = 'erase'; ci = buf.length; }
      } else {
        if (ci > 0) { buf = target.slice(0, --ci); inp.placeholder = buf; }
        else { mode = 'type'; pi = (pi + 1) % LANDING_PROMPTS.length; ci = 0; buf = ''; }
      }
    }, 60));
  }
  const form = document.getElementById('kur-prompt-form');
  if (form) {
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const v = (document.getElementById('kur-prompt-input').value || '').trim();
      const initial = v ? { goal:v } : {};
      setState({ modal:{ type:'onboard', step:1, name:'', email:'', brand:'', domain:'', stage:'', goal:'', ...initial } });
    });
  }
}

function bind() {
  document.querySelectorAll('[data-act]').forEach(el => {
    el.addEventListener('click', handleAct);
  });
  // Auto-scroll messages
  const ml = document.getElementById('msg-list');
  if (ml) ml.scrollTop = ml.scrollHeight;
  // Login enter
  const lp = document.getElementById('login-password');
  if (lp) lp.addEventListener('keydown', e => { if (e.key==='Enter') handleAct({ currentTarget:{ dataset:{ act:'do-login' } } }); });
  const le = document.getElementById('login-email');
  if (le) le.addEventListener('keydown', e => { if (e.key==='Enter') handleAct({ currentTarget:{ dataset:{ act:'do-login' } } }); });
  // Message draft enter
  const md = document.getElementById('msg-draft');
  if (md) md.addEventListener('keydown', e => { if (e.key==='Enter' && !e.shiftKey) { e.preventDefault(); handleAct({ currentTarget:{ dataset:{ act:'send-message' } } }); } });
  // Landing animations
  if (document.getElementById('kur-word')) startLandingAnims();
  else clearLandingAnims();
}
function captureObInputs(m) {
  const ids = ['ob-name','ob-email','ob-country','ob-brand','ob-website',
               'ob-linkedin','ob-instagram','ob-tiktok','ob-twitter','ob-youtube'];
  ids.forEach(id => {
    const el = document.getElementById(id);
    if (!el) return;
    const key = id.replace('ob-','');
    if (key === 'linkedin' || key === 'instagram' || key === 'tiktok' || key === 'twitter' || key === 'youtube') {
      m['social_'+key] = el.value;
    } else {
      m[key] = el.value;
    }
  });
}
function handleAct(e) {
  const ds = e.currentTarget.dataset;
  const act = ds.act;
  if (act === 'goto-login') setState({ view:'login', loginErr:null });
  else if (act === 'goto-landing') setState({ view:'landing', loginErr:null });
  else if (act === 'open-onboard') setState({ modal:{ type:'onboard', step:1, name:'', email:'', brand:'', domain:'', stage:'', goal:'' } });
  else if (act === 'close-modal') setState({ modal:null });
  else if (act === 'open-sidebar') setState({ sidebarOpen:true });
  else if (act === 'close-sidebar') setState({ sidebarOpen:false });
  else if (act === 'open-profile') setState({ modal:{ type:'profile' } });
  else if (act === 'logout') logout();
  else if (act === 'do-login') {
    const email = document.getElementById('login-email').value;
    const pw = document.getElementById('login-password').value;
    const err = login(email, pw);
    if (err) setState({ loginErr: err });
  }
  else if (act === 'nav') navigate(ds.route);
  else if (act === 'audit-tab') setState({ auditTab: ds.tab });
  else if (act === 'filter') setState({ filter: ds.f });
  else if (act === 'toggle-status') toggleStatus(ds.id);
  else if (act === 'sync') doSync();
  else if (act === 'send-message') sendMessage(document.getElementById('msg-draft').value);
  else if (act === 'ob-next' || act === 'ob-back') {
    const m = State.modal;
    captureObInputs(m);
    setState({ modal: { ...m, step: parseInt(ds.step) } });
  }
  else if (act === 'ob-segment') {
    setState({ modal: { ...State.modal, segment: ds.k } });
  }
  else if (act === 'ob-need') {
    const m = State.modal;
    const needs = m.needs || [];
    const k = ds.k;
    const next = needs.includes(k) ? needs.filter(x => x !== k) : [...needs, k];
    setState({ modal: { ...m, needs: next } });
  }
  else if (act === 'ob-toggle') {
    const m = State.modal;
    captureObInputs(m);
    setState({ modal: { ...m, [ds.key]: !m[ds.key] } });
  }
  else if (act === 'ob-submit') {
    const m = State.modal;
    captureObInputs(m);
    if (!m.name || !m.email) return;
    setState({ modal: { ...m, sent: true } });
    showToast('Submitted. A brand manager is on it.');
  }
  else if (act === 'prompt-focus') {
    const inp = document.getElementById('kur-prompt-input');
    if (inp) {
      window.scrollTo({ top: 0, behavior: 'smooth' });
      setTimeout(() => inp.focus(), 400);
    } else {
      setState({ modal:{ type:'onboard', step:1, name:'', email:'', brand:'', domain:'', stage:'', goal:'' } });
    }
  }
  else if (act === 'book-call') {
    const m = State.modal;
    const subject = `Discovery call — ${m.brand}`;
    const body = `Brand: ${m.brand}%0ADomain: ${m.domain}%0AStage: ${m.stage}%0AContact: ${m.name} · ${m.email}%0A%0AGoal: ${m.goal}%0A%0ABook a 10-minute slot at https://cal.com/kapture/discovery`;
    window.open(`mailto:hello@kurongeka.com?subject=${encodeURIComponent(subject)}&body=${body}`, '_blank');
  }
}

/* ============================ START ============================ */
render();
</script>
</body>
</html>
