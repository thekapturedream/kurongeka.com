function useClickOutside(ref, onClose, active=true) {
  useEffect(() => {
    if (!active) return;
    const handler = (e) => { if (ref.current && !ref.current.contains(e.target)) onClose(); };
    const esc = (e) => { if (e.key === 'Escape') onClose(); };
    document.addEventListener('mousedown', handler);
    document.addEventListener('keydown', esc);
    return () => {
      document.removeEventListener('mousedown', handler);
      document.removeEventListener('keydown', esc);
    };
  }, [active, onClose]);
}

/* ============================================================
   CONTEXT
   ============================================================ */
const AppCtx = createContext(null);
const useApp = () => useContext(AppCtx);

function AppProvider({ children }) {
  const [users] = useState(USERS);
  // Always start logged out. Login is private and kapture-issued.
  const [currentUser, setCurrentUser] = useState(null);
  // publicView controls what's shown when not logged in.
  // 'landing' (default) | 'start' (onboarding) | 'login' | 'case-study'
  const initialView = (() => {
    if (typeof window === 'undefined') return 'landing';
    const h = (window.location.hash || '').replace('#','').toLowerCase();
    if (h === 'start' || h === 'login' || h === 'case-study') return h;
    return 'landing';
  })();
  const [publicView, setPublicView] = useState(initialView);
  const goPublic = (v) => {
    setPublicView(v);
    if (typeof window !== 'undefined') window.location.hash = v === 'landing' ? '' : v;
  };
  // Client switcher — when route=case-study, the dashboard renders kapture data.
  const isCaseStudy = publicView === 'case-study';
  const activeClient = isCaseStudy ? KAPTURE_CLIENT : CLIENT;
  const activeChannels = isCaseStudy ? KAPTURE_CHANNELS : SOCIAL_CHANNELS;
  const activePress = isCaseStudy ? KAPTURE_PRESS : PRESS;
  const activeIdentity = isCaseStudy ? KAPTURE_IDENTITY : IDENTITY_RECORDS;
  const activeSEO = isCaseStudy ? KAPTURE_SEO : SEO;
  // Listen to hash changes (back/forward)
  useEffect(() => {
    if (typeof window === 'undefined') return;
    const handler = () => {
      const h = (window.location.hash || '').replace('#','').toLowerCase();
      setPublicView(h === 'start' || h === 'login' || h === 'case-study' ? h : 'landing');
    };
    window.addEventListener('hashchange', handler);
    return () => window.removeEventListener('hashchange', handler);
  }, []);
  const [route, setRoute] = useState('dashboard');
  const [actions, setActions] = useState(() => loadLS('kr.actions', ACTIONS));
  const [messages, setMessages] = useState(() => loadLS('kr.messages', MESSAGES));
  const [deliverables] = useState(DELIVERABLES);
  const [sidebarOpen, setSidebarOpen] = useState(false);
  const [profileOpen, setProfileOpen] = useState(false);
  const [toast, setToast] = useState(null);

  // ---------- VERIFIED CRAWL TIMER ----------
  // Honest: numbers come from a manual crawl on the verified date. Sync re-runs the
  // crawl simulation so timestamps refresh, but we do NOT fabricate count drift.
  // Channels switch automatically based on which client is active.
  const channels = activeChannels;
  const [lastSync, setLastSync] = useState(Date.now());
  const [syncing, setSyncing] = useState(false);
  const [tick, setTick] = useState(0);

  useEffect(() => {
    const t = setInterval(() => setTick(k => k + 1), 1000);
    return () => clearInterval(t);
  }, []);

  const doSync = useCallback((manual = true) => {
    setSyncing(true);
    setTimeout(() => {
      setLastSync(Date.now());
      setSyncing(false);
      if (manual) setToast('Synced.');
    }, manual ? 900 : 400);
  }, []);

  useEffect(() => saveLS('kr.actions', actions), [actions]);
  useEffect(() => saveLS('kr.messages', messages), [messages]);
  useEffect(() => { if (toast) { const t = setTimeout(()=>setToast(null), 2400); return ()=>clearTimeout(t); } }, [toast]);

  const navigate = (r) => { setRoute(r); setSidebarOpen(false); window.scrollTo(0,0); };
  const updateAction = (id, patch) => setActions(prev => prev.map(a => a.id===id ? {...a, ...patch} : a));
  const sendMessage = (text) => {
    if (!text.trim() || !currentUser) return;
    const other = currentUser.role === 'client' ? 'U-KAP' : 'U-TURA';
    setMessages(prev => [...prev, { id:uid('M'), from:currentUser.id, to:other, text:text.trim(), at:new Date().toISOString(), read:false }]);
  };
  const showToast = (text) => setToast(text);
  const logout = () => {
    const wasDemo = currentUser?.isDemo;
    setCurrentUser(null);
    setRoute('dashboard');
    // if leaving the case study, return to landing
    if (wasDemo) goPublic('landing');
  };

  const value = { users, currentUser, setCurrentUser, route, navigate, actions, updateAction, messages, sendMessage, deliverables, sidebarOpen, setSidebarOpen, profileOpen, setProfileOpen, toast, showToast, logout, client: activeClient, channels, press: activePress, identity: activeIdentity, seo: activeSEO, lastSync, syncing, doSync, tick, publicView, goPublic, isCaseStudy };
  return <AppCtx.Provider value={value}>{children}</AppCtx.Provider>;
}

function Brand({ size='md', invert=false, variant='hero' }) {
  const sz = size==='lg' ? 40 : size==='sm' ? 22 : 28;
  const fill = invert ? '#ffffff' : '#000000';
  const base = invert ? 'text-white' : 'text-ink';
  const sub = invert ? 'text-white/45' : 'text-subtle';

  if (variant === 'nav') {
    return (
      <div className="flex items-center gap-2 min-w-0">
        <KaptureMark size={sz} fill={fill} accent="#ffcc00"/>
        <span className={`font-display font-extrabold tracking-tight ${size==='lg'?'text-[18px]':'text-[15px]'} ${base} truncate leading-none`}>
          kurongeka<span className={`${sub} font-medium`}>.com</span>
        </span>
      </div>
    );
  }

  return (
    <div className="flex items-center gap-2.5">
      <KaptureMark size={sz} fill={fill} accent="#ffcc00"/>
      <div className="flex flex-col leading-none">
        <span className={`font-display font-extrabold tracking-tight ${size==='lg'?'text-[22px]':'text-[16px]'} ${base}`}>kurongeka</span>
        <span className={`text-[10px] mt-1 ${sub} font-medium tracking-wider uppercase`}>by kapture</span>

}

function Avatar({ name, size=32, invert=false, isTeam=false }) {

function Field({ label, hint, required, children }) {

      </div>

function Btn({ children, onClick, variant='primary', size='', className='', disabled=false, type='button' }) {
  return (
    <button type={type} onClick={onClick} disabled={disabled}
      className={`btn btn-${variant} ${size?`btn-${size}`:''} ${className}`}>
      {children}
    </button>
  );
}

function Pill({ children, tone='default', size='' }) {
  const tones = {
    default: 'bg-canvas text-ink',
    good:    'bg-[#d8f3e3] text-[#024d28]',
    ok:      'bg-canvas text-muted',
    warn:    'bg-[#fff0d6] text-[#7a3a00]',
    bad:     'bg-[#fee5e0] text-[#9a1100]',
    info:    'bg-[#e0ebff] text-[#003ec0]',
    dark:    'bg-black text-white',
  };
  return <span className={`pill ${size==='lg'?'pill-lg':''} ${tones[tone]}`}>{children}</span>;
}

function ScoreBadge({ score, size=64 }) {
  const tone = score >= 80 ? '#05944f' : score >= 60 ? '#000' : score >= 40 ? '#ff8a00' : '#e11900';
  const r = (size-10)/2;
  const c = 2 * Math.PI * r;
  const off = c - (score/100) * c;
  return (
    <div className="relative" style={{ width:size, height:size }}>
      <svg width={size} height={size}>
        <circle cx={size/2} cy={size/2} r={r} fill="none" stroke="#f0f0f0" strokeWidth="5"/>
        <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={tone} strokeWidth="5"
          strokeDasharray={c} strokeDashoffset={off} strokeLinecap="round"
          transform={`rotate(-90 ${size/2} ${size/2})`}/>
      </svg>
      <div className="absolute inset-0 grid place-items-center font-display font-extrabold" style={{ fontSize:size*0.32 }}>{score}</div>
    </div>
  );
}

function Toast() {
  const { toast } = useApp();
  if (!toast) return null;
  return (
    <div className="fixed bottom-6 left-1/2 -translate-x-1/2 z-[100] fade-in">
      <div className="bg-black text-white rounded-xl px-5 py-3 shadow-xl text-sm font-medium flex items-center gap-2">
        <I n="check" s={16}/> {toast}
      </div>
    </div>
  );
}

function liveAgo(iso, tick) {
  if (!iso) return '—';
  const sec = Math.max(0, Math.floor((Date.now() - new Date(iso).getTime()) / 1000));
  if (sec < 60) return sec + 's ago';
  if (sec < 3600) return Math.floor(sec/60) + 'm ago';
  if (sec < 86400) return Math.floor(sec/3600) + 'h ago';
  return Math.floor(sec/86400) + 'd ago';
}

function PlanPage() {
  const { actions, updateAction, showToast } = useApp();
  const [filter, setFilter] = useState('all');
  const tiers = [
    { k:'immediate', l:'Immediate', sub:'This week', i:'flame', tone:'#fff0d6' },
    { k:'short',     l:'Short term', sub:'1–3 months', i:'zap',  tone:'#e0ebff' },
    { k:'long',      l:'Long term',  sub:'6–12 months', i:'target', tone:'#d8f3e3' },
  ];
  const visible = actions.filter(a => filter==='all' || a.priority === filter);

  const toggleStatus = (a) => {
    const next = a.status === 'done' ? 'todo' : a.status === 'todo' ? 'in_progress' : 'done';
    updateAction(a.id, { status: next });
    showToast(`Marked "${a.title.slice(0,30)}…" as ${next.replace('_',' ')}`);
  };

  return (
    <div className="px-5 lg:px-8 py-6 lg:py-8 has-bottom-tab">
      <div className="mb-5 flex items-end justify-between flex-wrap gap-4">
        <div>
          <div className="text-[12px] font-semibold uppercase tracking-wider text-subtle">Action plan · 19 recommendations</div>
          <h1 className="display-2 font-display font-extrabold mt-1.5">What we do, in what order.</h1>
          <p className="text-muted text-[15px] mt-2 max-w-2xl">Every recommendation has a tier (when), a priority (urgency), an effort (S/M/L/XL), an impact (M/H/XL), an owner and a status. Move them across as we ship.</p>
        </div>
        <div className="flex gap-2">
          {['all','high','medium','low'].map(f => (
            <button key={f} onClick={()=>setFilter(f)} className={`chip ${filter===f?'selected':''}`}>{f}</button>
          ))}
        </div>
      </div>

      <div className="grid grid-cols-1 lg:grid-cols-3 gap-4">
        {tiers.map(t => {
          const items = visible.filter(a => a.tier === t.k);
          const done = items.filter(a => a.status === 'done').length;
          const pct = items.length ? Math.round((done / items.length) * 100) : 0;
          return (
            <div key={t.k} className="kanban-col">
              <div className="flex items-center justify-between mb-3">
                <div className="flex items-center gap-2">
                  <div className="h-9 w-9 rounded-[10px] grid place-items-center" style={{ background:t.tone }}><I n={t.i} s={16}/></div>
                  <div>
                    <div className="font-display font-extrabold text-[16px] leading-tight">{t.l}</div>
                    <div className="text-[11px] text-muted font-semibold uppercase tracking-wider">{t.sub} · {items.length}</div>
                  </div>
                </div>
                <div className="text-[12px] font-bold">{pct}%</div>
              </div>
              <div className="progress mb-4 bg-white"><span style={{ width:`${pct}%` }}/></div>
              <div className="space-y-2.5">
                {items.map(a => (
                  <div key={a.id} className="kanban-card">
                    <div className="flex items-start justify-between gap-2 mb-2">
                      <div className="font-display font-bold text-[14px] leading-snug flex-1">{a.title}</div>
                      <button className={`shrink-0 h-6 w-6 rounded-full border-2 grid place-items-center transition ${a.status==='done'?'bg-good border-good text-white':a.status==='in_progress'?'bg-ink border-ink text-white':'border-line text-muted hover:border-ink'}`}
                        onClick={()=>toggleStatus(a)}>
                        {a.status==='done' && <I n="check" s={14}/>}
                        {a.status==='in_progress' && <I n="more" s={14}/>}
                      </button>
                    </div>
                    <div className="text-[12px] text-muted leading-relaxed mb-3">{a.desc}</div>
                    <div className="flex items-center gap-1.5 flex-wrap">
                      <Pill tone={a.priority==='high'?'warn':a.priority==='medium'?'default':'ok'}>{a.priority}</Pill>
                      <Pill tone="default">Effort {a.effort}</Pill>
                      <Pill tone="default">Impact {a.impact}</Pill>
                      <Pill tone="default">{a.pillar}</Pill>
                      {a.status === 'done' && <Pill tone="good">done</Pill>}
                      {a.status === 'in_progress' && <Pill tone="dark">in progress</Pill>}
                      {a.status === 'design_done' && <Pill tone="info">design done</Pill>}
                    </div>
                  </div>
                ))}
                {items.length === 0 && (
                  <div className="text-center py-8 text-[12px] text-subtle">No items at this priority.</div>
                )}
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

  const kaptureUser = users.find(u => u.id === 'U-KAP') || { id:'U-KAP', name:'kapture', role:'strategist', org:'kapture', isTeam:true };

  useEffect(() => { endRef.current?.scrollIntoView({ behavior:'smooth' }); }, [messages]);

  const submit = () => { if (!draft.trim()) return; sendMessage(draft); setDraft(''); };

  return (
    <div className="flex flex-col" style={{ height:'calc(100svh - 64px)', minHeight:0 }}>
      {/* Thread header */}
      <div className="px-5 lg:px-8 py-4 border-b border-line flex items-center gap-3 bg-white shrink-0">
        <Avatar name={kaptureUser.name} size={40} isTeam/>
        <div className="flex-1 min-w-0">
          <div className="font-display font-bold text-[15px] truncate lowercase">kapture</div>
          <div className="text-[12px] text-muted truncate">Brand studio · usually replies within 2 hours</div>
        </div>
        <div className="hidden sm:flex items-center gap-1.5 text-[12px] text-muted"><span className="dot bg-good pulse-dot"/> Online</div>
      </div>

      {/* Messages */}
      <div className="flex-1 overflow-y-auto px-5 lg:px-8 py-6 has-bottom-tab" style={{ minHeight:0 }}>
        <div className="max-w-3xl mx-auto space-y-3">
          {messages.map(m => {
            const mine = m.from === currentUser.id;
            const sender = users.find(u => u.id === m.from) || kaptureUser;
            return (
              <div key={m.id} className={`flex gap-2 ${mine?'flex-row-reverse':''}`}>
                <Avatar name={sender.name} size={28} isTeam={sender.isTeam}/>
                <div className={`max-w-[85%] ${mine?'items-end':'items-start'} flex flex-col gap-1`}>
                  <div className={`rounded-2xl px-4 py-2.5 text-[14px] leading-snug ${mine?'bg-ink text-white rounded-br-sm':'bg-canvas text-ink rounded-bl-sm'}`}>{m.text}</div>
                  <div className="text-[10px] text-subtle">{relTime(m.at)}{mine && (m.read?' · read':' · sent')}</div>
                </div>
              </div>
            );
          })}
          <div ref={endRef}/>
        </div>
      </div>

      {/* Composer */}
      <div className="px-5 lg:px-8 py-4 border-t border-line bg-white shrink-0" style={{ paddingBottom: 'calc(1rem + env(safe-area-inset-bottom))' }}>
        <div className="max-w-3xl mx-auto flex items-end gap-2">
          <button className="btn btn-secondary p-3"><I n="paperclip" s={16}/></button>
          <textarea
            className="input flex-1 resize-none"
            rows={1}
            value={draft}
            onChange={e=>setDraft(e.target.value)}
            onKeyDown={e=>{ if (e.key==='Enter' && !e.shiftKey) { e.preventDefault(); submit(); } }}
            placeholder="Message kapture…"
            style={{ maxHeight:120 }}
          />
          <Btn onClick={submit} disabled={!draft.trim()}><I n="send" s={16}/></Btn>
        </div>
      </div>
    </div>
  );
}

/* ============================================================
   ONBOARDING — short 5-step request audit
   ============================================================ */
function OnboardingFlow() {
  const { goPublic } = useApp();
  const [step, setStep] = useState(1);
  const [data, setData] = useState({
    name:'', email:'', brand:'', website:'',
    what:'',
    handles:{ instagram:'', linkedin:'', youtube:'', tiktok:'' },
    goals:[],
    when:'',
  });
  const total = 5;
  const update = (k, v) => setData(d => ({ ...d, [k]: v }));
  const updateHandle = (k, v) => setData(d => ({ ...d, handles: { ...d.handles, [k]: v } }));
  const toggleGoal = (g) => setData(d => ({ ...d, goals: d.goals.includes(g) ? d.goals.filter(x=>x!==g) : [...d.goals, g] }));

  const validateStep = () => {
    if (step === 1) return data.name && data.email && data.brand;
    if (step === 2) return data.what.length > 3;
    if (step === 3) return true;
    if (step === 4) return data.goals.length > 0;
    if (step === 5) return data.when;
    return true;
  };

  const submit = () => {
    const lines = [];
    lines.push(`Audit request — ${data.brand}`, '');
    lines.push(`Name: ${data.name}`);
    lines.push(`Email: ${data.email}`);
    lines.push(`Brand: ${data.brand}`);
    if (data.website) lines.push(`Website: ${data.website}`);
    lines.push(`What they do: ${data.what}`);
    lines.push('');
    lines.push('Social handles:');
    Object.entries(data.handles).forEach(([k,v]) => v && lines.push(`  ${k}: ${v}`));
    lines.push('');
    lines.push(`Goals: ${data.goals.join(', ')}`);
    lines.push(`Best time for discovery call: ${data.when}`);
    const subject = `kurongeka audit request — ${data.brand}`;
    const body = encodeURIComponent(lines.join('\n'));
    window.location.href = `mailto:studio@thekapture.com?subject=${encodeURIComponent(subject)}&body=${body}`;
    setStep(99); // confirmation
  };

  return (
    <div className="min-h-screen bg-paper flex flex-col">
      <header className="sticky top-0 z-50 bg-paper/95 backdrop-blur border-b border-line">
        <div className="max-w-3xl mx-auto px-5 lg:px-8 h-16 flex items-center justify-between">
          <button onClick={()=>goPublic('landing')} className="flex items-center gap-2"><Brand size="sm" variant="nav"/></button>
          {step < 99 && <span className="text-[12px] font-semibold text-muted">Step {step} of {total}</span>}
        </div>
        {/* Progress */}
        {step < 99 && (
          <div className="h-1 bg-canvas">
            <div className="h-full bg-ink transition-all" style={{ width:`${(step/total)*100}%` }}/>
          </div>
        )}
      </header>

      <main className="flex-1 px-5 lg:px-8 py-12 sm:py-20">
        <div className="max-w-xl mx-auto">
          {step === 1 && (
            <div className="fade-in">
              <h2 className="font-display font-extrabold text-3xl sm:text-4xl mb-2 tracking-tight">Tell us about you.</h2>
              <p className="text-muted mb-8">Three quick fields. We need this to send the call invite.</p>
              <div className="space-y-3">
                <Field label="Your name" required><input className="input" autoFocus value={data.name} onChange={e=>update('name', e.target.value)} placeholder="Full name"/></Field>
                <Field label="Email" required><input className="input" type="email" value={data.email} onChange={e=>update('email', e.target.value)} placeholder="you@brand.com"/></Field>
                <Field label="Brand or business name" required><input className="input" value={data.brand} onChange={e=>update('brand', e.target.value)} placeholder="e.g. Tura Arutura · Acme Studio"/></Field>
                <Field label="Website (if any)"><input className="input" value={data.website} onChange={e=>update('website', e.target.value)} placeholder="yourbrand.com"/></Field>
              </div>
            </div>
          )}
          {step === 2 && (
            <div className="fade-in">
              <h2 className="font-display font-extrabold text-3xl sm:text-4xl mb-2 tracking-tight">What do you do?</h2>
              <p className="text-muted mb-8">One sentence. The way you'd say it to a stranger.</p>
              <Field label="In one line"><textarea className="input" rows="3" autoFocus value={data.what} onChange={e=>update('what', e.target.value)} placeholder="e.g. I'm a Belfast-based Sean Nós dancer running workshops for schools and festivals."/></Field>
            </div>
          )}
          {step === 3 && (
            <div className="fade-in">
              <h2 className="font-display font-extrabold text-3xl sm:text-4xl mb-2 tracking-tight">Where do you live online?</h2>
              <p className="text-muted mb-8">Drop the handles you have. Skip the rest.</p>
              <div className="space-y-3">
                {[
                  { k:'instagram', i:'instagram', placeholder:'@handle or instagram.com/handle' },
                  { k:'linkedin',  i:'linkedin',  placeholder:'linkedin.com/in/you' },
                  { k:'youtube',   i:'youtube',   placeholder:'@channel or youtube.com/c/channel' },
                  { k:'tiktok',    i:'tiktok',    placeholder:'@handle' },
                ].map(h => (
                  <div key={h.k} className="flex items-center gap-3">
                    <div className="h-11 w-11 rounded-[10px] bg-canvas grid place-items-center shrink-0"><I n={h.i} s={18}/></div>
                    <input className="input flex-1" value={data.handles[h.k]} onChange={e=>updateHandle(h.k, e.target.value)} placeholder={h.placeholder}/>
                  </div>
                ))}
              </div>
            </div>
          )}
          {step === 4 && (
            <div className="fade-in">
              <h2 className="font-display font-extrabold text-3xl sm:text-4xl mb-2 tracking-tight">What do you want next?</h2>
              <p className="text-muted mb-8">Pick all that apply.</p>
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                {['More bookings','Bigger audience','Stronger brand','New website','Press / PR','Investor-ready','Launch a product','Just curious'].map(g => (
                  <button key={g} onClick={()=>toggleGoal(g)} className={`p-4 rounded-[10px] border-2 text-left text-[14px] font-semibold transition ${data.goals.includes(g) ? 'bg-ink text-paper border-ink' : 'bg-paper border-line hover:border-ink'}`}>{g}</button>
                ))}
              </div>
            </div>
          )}
          {step === 5 && (
            <div className="fade-in">
              <h2 className="font-display font-extrabold text-3xl sm:text-4xl mb-2 tracking-tight">When can we call you?</h2>
              <p className="text-muted mb-8">A free 10-minute discovery. We'll confirm by email.</p>
              <div className="space-y-2">
                {['This week (any day, mornings)','This week (any day, afternoons)','Next week (mornings)','Next week (afternoons)','Flexible — book me into your calendar'].map(w => (
                  <button key={w} onClick={()=>update('when', w)} className={`w-full p-4 rounded-[10px] border-2 text-left text-[14px] font-semibold transition ${data.when === w ? 'bg-ink text-paper border-ink' : 'bg-paper border-line hover:border-ink'}`}>{w}</button>
                ))}
              </div>
            </div>
          )}
          {step === 99 && (
            <div className="fade-in text-center">
              <div className="h-16 w-16 rounded-full mx-auto mb-6 grid place-items-center" style={{ background:'#ffcc00' }}>
                <I n="check" s={32} c="text-ink"/>
              </div>
              <h2 className="font-display font-extrabold text-3xl sm:text-4xl mb-3 tracking-tight">Request sent.</h2>
              <p className="text-muted text-[15px] mb-2">Your email client opened with everything filled in. Hit send and a brand manager will be in touch within 1 working day.</p>
              <p className="text-muted text-[15px] mb-8">If your email client didn't open, just reach us at <a className="text-ink underline" href="mailto:studio@thekapture.com">studio@thekapture.com</a>.</p>
              <div className="flex gap-3 justify-center flex-wrap">
                <button onClick={()=>goPublic('case-study')} className="btn btn-outline">See an audit example</button>
                <button onClick={()=>goPublic('landing')} className="btn btn-primary">Back to home</button>
              </div>
            </div>
          )}
        </div>
      </main>

      {step < 99 && (
        <footer className="sticky bottom-0 bg-paper border-t border-line" style={{ paddingBottom:'env(safe-area-inset-bottom)' }}>
          <div className="max-w-3xl mx-auto px-5 lg:px-8 py-4 flex items-center justify-between gap-3">
            <button onClick={()=>{ if (step === 1) goPublic('landing'); else setStep(s => s - 1); }} className="btn btn-outline btn-sm">
              <I n="arrowLeft" s={14}/> Back
            </button>
            {step < total ? (
              <button onClick={()=>setStep(s => s + 1)} disabled={!validateStep()} className="btn btn-primary">Continue <I n="arrowRight" s={14}/></button>
            ) : (
              <button onClick={submit} disabled={!validateStep()} className="btn btn-primary">Book my discovery call <I n="arrowRight" s={14}/></button>
            )}
          </div>
        </footer>
      )}
    </div>
  );
}

/* ============================================================
   ROOT — public landing / onboarding / case study / login / app
   ============================================================ */
function Root() {
  const { currentUser, publicView, isCaseStudy, setCurrentUser } = useApp();
  // Auto-create a public-visitor session when entering case-study mode so MainShell
  // renders with kapture data — no real login required.
  useEffect(() => {
    if (isCaseStudy && !currentUser) {
      setCurrentUser({ id:'C-DEMO', name:'Public preview', role:'client', email:'demo@kurongeka.com', org:'kapture (case study)', title:'Case study viewer', isDemo:true });
    }
    if (!isCaseStudy && currentUser?.isDemo) {
      setCurrentUser(null);
    }
  }, [isCaseStudy]);
  if (currentUser) return <MainShell/>;
  if (publicView === 'start') return <OnboardingFlow/>;
  if (publicView === 'login') return <AuthScreen/>;
  return <PublicLanding/>;
}

function App() { return <AppProvider><Root/><Toast/></AppProvider>; }

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
